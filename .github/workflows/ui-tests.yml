name: Healthcare UI Automation
on: [push, pull_request, workflow_dispatch]
jobs:
  selenium-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: maven }
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - name: Start demo portal
        run: |
          python3 -m http.server 8080 --directory app/demo > /tmp/carepoint.log 2>&1 &
          sleep 2
      - name: Run tests (headless Chrome)
        run: mvn -B clean test -Dbrowser=chrome -Dheadless=true -Dbase.url=http://localhost:8080
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-test-reports
          path: reports/
